<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radar Meme Maker</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--accent:#3dff6b;--on:#03130a;--bg:color-mix(in srgb,var(--accent) 4%,#000);--panel:color-mix(in srgb,var(--accent) 8%,#000);--line:color-mix(in srgb,var(--accent) 24%,#000);--fg:color-mix(in srgb,var(--accent) 30%,#fff);--dim:color-mix(in srgb,var(--accent) 60%,#000)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:20px 16px 40px}
main{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.04em}
p.sub{margin:0 0 18px;color:var(--dim)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
canvas{width:100%;max-width:340px;aspect-ratio:1;border:2px solid var(--line);cursor:crosshair;display:block;margin:0 auto;touch-action:manipulation}
.panel{background:var(--panel);border:1px solid var(--line);padding:14px}
label{display:block;color:var(--dim);font-size:12px;margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
input[type=text]{width:100%;background:#03090500;border:1px solid var(--line);color:var(--fg);padding:8px 10px;font:inherit;background:#030905}
input[type=text]:focus{outline:1px solid var(--accent)}
button{font:inherit;border:1px solid var(--accent);background:transparent;color:var(--accent);padding:9px 14px;cursor:pointer}
button:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
button.primary{background:var(--accent);color:var(--on);font-weight:700;width:100%;margin-top:12px;padding:12px}
button.primary:disabled{opacity:.5;cursor:wait}
button.x{padding:6px 10px;border-color:var(--line);color:var(--dim)}
.crow{display:flex;gap:6px;align-items:center;margin-bottom:14px}.crow input[type=text]{min-width:0;flex:1}input[type=color]{width:44px;height:38px;padding:2px;background:#030905;border:1px solid var(--line);cursor:pointer}
#list{display:flex;flex-direction:column;gap:6px;margin:12px 0 0;max-height:240px;overflow-y:auto}
.row{display:flex;gap:6px}
.hint{color:var(--dim);font-size:12px;margin:8px 0 0}
#status{margin-top:10px;min-height:20px;font-size:13px}
#out{margin-top:12px;text-align:center;display:none}
#out img{max-width:100%;border:1px solid var(--line)}
#out a{display:inline-block;margin-top:8px;color:var(--accent)}
</style>
</head>
<body>
<main>
<div class="grid">
  <div><canvas id="c" width="320" height="320"></canvas></div>
  <div class="panel">
    <label for="hex">Radar color</label>
    <div class="crow"><input type="color" id="cp" value="#3dff6b" aria-label="Pick color"><input type="text" id="hex" value="#3dff6b" maxlength="7" spellcheck="false" autocomplete="off"><button id="rb" type="button">Reset</button></div>
    <label for="name">Name for next point</label>
    <input type="text" id="name" value="" placeholder="Point name" maxlength="24" autocomplete="off">
    <p class="hint">Type a name, then click inside the radar to place it.</p>
    <div id="list"></div>
    <button class="primary" id="export">Export GIF &amp; copy</button>
    <div id="status"></div>
    <div id="out"><img id="img" alt="Generated radar GIF"><br><a id="dl" download="radar-meme.gif">Download GIF</a></div>
  </div>
</div>
</main>
<script>
const W=320,R=150,CX=160,CY=160,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{willReadFrequently:true});
let pts=[];
let n=0;

const DEF='#3dff6b';let ACC=[61,255,107],PAL=[];const CACHE=new Map();
function ramp(u){const a=ACC;if(u<=.75){const k=u/.75;return[a[0]*k,a[1]*k,a[2]*k]}const k=(u-.75)/.25*.85;return[a[0]+(255-a[0])*k,a[1]+(255-a[1])*k,a[2]+(255-a[2])*k]}
function rc(u,al=1){const c=ramp(u).map(Math.round);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')'}
function draw(a){
  ctx.fillStyle=rc(0.02);ctx.fillRect(0,0,W,W);
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.clip();
  ctx.fillStyle=rc(0.07);ctx.fillRect(0,0,W,W);
  ctx.strokeStyle=rc(0.4);ctx.lineWidth=1;
  for(let i=1;i<=4;i++){ctx.beginPath();ctx.arc(CX,CY,R*i/4,0,TAU);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(CX-R,CY);ctx.lineTo(CX+R,CY);ctx.moveTo(CX,CY-R);ctx.lineTo(CX,CY+R);ctx.stroke();
  const S=36;
  for(let i=0;i<S;i++){
    const a1=a-i*0.028,a0=a1-0.028;
    ctx.fillStyle=rc(0.75,0.5*(1-i/S));
    ctx.beginPath();ctx.moveTo(CX,CY);ctx.arc(CX,CY,R,a0,a1+0.002);ctx.closePath();ctx.fill();
  }
  ctx.strokeStyle=rc(0.85);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+R*Math.cos(a),CY+R*Math.sin(a));ctx.stroke();
  for(const p of pts){
    const px=CX+p.x*R,py=CY+p.y*R,th=Math.atan2(p.y,p.x);
    const d=(((a-th)%TAU)+TAU)%TAU;
    const k=Math.pow(Math.max(0,1-d/(TAU*0.75)),2);
    ctx.fillStyle=rc(0.88,0.15+0.85*k);
    ctx.beginPath();ctx.arc(px,py,4+3*k,0,TAU);ctx.fill();
    if(d<1.3){
      ctx.strokeStyle=rc(0.88,1-d/1.3);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(px,py,6+d*26,0,TAU);ctx.stroke();
    }
    if(k>0.12){
      ctx.font='bold 14px monospace';
      const tw=ctx.measureText(p.name).width,left=px+10+tw>W-6;
      ctx.fillStyle=rc(0.97,Math.min(1,k*1.6));
      ctx.textAlign=left?'right':'left';
      ctx.fillText(p.name,left?px-10:px+10,py-8);
    }
  }
  ctx.restore();
  ctx.strokeStyle=rc(0.55);ctx.lineWidth=3;ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.stroke();
}

let t0=performance.now();
(function loop(t){draw(((t-t0)/2400)*TAU);requestAnimationFrame(loop)})(t0);

cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect();
  const x=((e.clientX-r.left)/r.width*W-CX)/R,y=((e.clientY-r.top)/r.height*W-CY)/R;
  if(x*x+y*y>0.95)return;
  const el=document.getElementById('name');
  pts.push({x,y,name:el.value.trim()||('Point '+(++n))});
  el.focus();renderList();
});

function renderList(){
  const L=document.getElementById('list');L.innerHTML='';
  pts.forEach((p,i)=>{
    const row=document.createElement('div');row.className='row';
    const inp=document.createElement('input');inp.type='text';inp.value=p.name;inp.maxLength=24;
    inp.oninput=()=>{p.name=inp.value};
    const b=document.createElement('button');b.className='x';b.textContent='✕';b.title='Remove';
    b.onclick=()=>{pts.splice(i,1);renderList()};
    row.append(inp,b);L.append(row);
  });
}
renderList();

/* ---- color ---- */
const cp=document.getElementById('cp'),hx=document.getElementById('hex');
function norm(s){s=s.trim().replace(/^#/,'');if(/^[0-9a-f]{3}$/i.test(s))s=s.replace(/./g,'$&$&');return /^[0-9a-f]{6}$/i.test(s)?'#'+s.toLowerCase():null}
function setColor(h,keepHex){
  const v=parseInt(h.slice(1),16);ACC=[v>>16,(v>>8)&255,v&255];
  PAL=[];for(let i=0;i<256;i++)PAL.push(ramp(i/255).map(Math.round));CACHE.clear();
  cp.value=h;if(!keepHex)hx.value=h;
  const s=document.documentElement.style;s.setProperty('--accent',h);
  s.setProperty('--on',(0.299*ACC[0]+0.587*ACC[1]+0.114*ACC[2])>140?'#03130a':'#fff');
}
cp.oninput=()=>setColor(cp.value);
hx.oninput=()=>{const h=norm(hx.value);if(h)setColor(h,true)};
hx.onchange=()=>{hx.value=cp.value};
document.getElementById('rb').onclick=()=>setColor(DEF);
setColor(DEF);

/* ---- minimal GIF encoder ---- */
function lzw(px){
  const out=[];let buf=0,cnt=0,size=9,next=258;const dict=new Map();
  const emit=c=>{buf|=c<<cnt;cnt+=size;while(cnt>=8){out.push(buf&255);buf>>>=8;cnt-=8}};
  emit(256);let pre=px[0];
  for(let i=1;i<px.length;i++){
    const c=px[i],key=(pre<<8)|c,v=dict.get(key);
    if(v!==undefined){pre=v;continue}
    emit(pre);
    if(next<4096){dict.set(key,next);if(next===(1<<size))size++;next++}
    else{emit(256);dict.clear();next=258;size=9}
    pre=c;
  }
  emit(pre);emit(257);if(cnt>0)out.push(buf&255);
  return out;
}
function encodeGIF(frames,w,h,delay){
  const o=[],p=(...b)=>{for(const x of b)o.push(x)},w16=v=>p(v&255,v>>8);
  for(const ch of 'GIF89a')o.push(ch.charCodeAt(0));
  w16(w);w16(h);p(0xF7,0,0);
  for(let i=0;i<256;i++){
    p(PAL[i][0],PAL[i][1],PAL[i][2]);
  }
  p(0x21,0xFF,11);for(const ch of 'NETSCAPE2.0')o.push(ch.charCodeAt(0));p(3,1,0,0,0);
  for(const f of frames){
    p(0x21,0xF9,4,0,delay&255,delay>>8,0,0);
    p(0x2C);w16(0);w16(0);w16(w);w16(h);p(0,8);
    const d=lzw(f);
    for(let i=0;i<d.length;i+=255){const c=d.slice(i,i+255);p(c.length);for(const x of c)o.push(x)}
    p(0);
  }
  p(0x3B);return new Uint8Array(o);
}
function quant(img){
  const d=img.data,out=new Uint8Array(W*W);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const key=(d[i]<<16)|(d[i+1]<<8)|d[i+2];let v=CACHE.get(key);
    if(v===undefined){let best=1e9;v=0;for(let k=0;k<256;k++){const q=PAL[k],dr=q[0]-d[i],dg=q[1]-d[i+1],db=q[2]-d[i+2],s=dr*dr+dg*dg+db*db;if(s<best){best=s;v=k}}CACHE.set(key,v)}
    out[j]=v;
  }
  return out;
}

/* ---- export ---- */
const btn=document.getElementById('export'),st=document.getElementById('status');
btn.onclick=()=>{
  if(!pts.length){st.textContent='Add at least one point first.';return}
  btn.disabled=true;st.textContent='Rendering frames…';
  const N=48,job=(async()=>{
    const frames=[];
    for(let f=0;f<N;f++){
      draw((f/N)*TAU);frames.push(quant(ctx.getImageData(0,0,W,W)));
      if(f%8===0)await new Promise(r=>setTimeout(r));
    }
    return new Blob([encodeGIF(frames,W,W,5)],{type:'image/gif'});
  })();
  job.then(async blob=>{
    const url=URL.createObjectURL(blob);
    document.getElementById('img').src=url;
    const dl=document.getElementById('dl');dl.href=url;
    document.getElementById('out').style.display='block';
    try{
      await navigator.clipboard.write([new ClipboardItem({'image/gif':blob})]);
      st.textContent='✅ GIF copied to clipboard.';
    }catch(err){
      try{
        const png=await new Promise(r=>{draw(0);cv.toBlob(r,'image/png')});
        await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);
        st.textContent='Your browser can’t copy GIFs, so a still frame was copied. Right-click the GIF below → Copy image, or download it.';
      }catch(e2){
        st.textContent='Clipboard blocked here. Right-click the GIF below → Copy image, or download it.';
      }
    }
    btn.disabled=false;
  }).catch(e=>{st.textContent='Export failed: '+e.message;btn.disabled=false});
};
</script>
</body>
</html>
